name: Bug report
description: Report any actual or potential behavior that could be unsafe, inappropriate for its intended use, or contrary to specification.
labels: []
type: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: affected-functionality
    attributes:
      label: Affected functionality

  - type: dropdown
    id: risk
    attributes:
      label: Risk Assessment
      description: What is the critical impact of this bug?
      options:
        - Negligible
        - Minor
        - Serious
        - Major
        - Critical
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.